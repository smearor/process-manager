name: MSRV
run-name: Minimum Supported Rust Version for ${{ github.ref == 'refs/heads/main' && 'Nightly' || github.event_name == 'pull_request' && format('{0} {1}', 'Pull Request', github.event.pull_request.number) || format('{0} {1}', 'Branch', github.ref) }} by @${{ github.actor }}

on:
  push:
    branches: [ main ]
    paths:
      - "process-manager-*/src/**/*.rs"
      - "process-manager-*/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/msrv.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "process-manager-*/src/**/*.rs"
      - "process-manager-*/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/msrv.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: VCS Checkout
        uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install cargo msrv
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-msrv@0.19.3
      - name: Version of cargo msrv
        run: cargo msrv --version
      - name: Run cargo msrv (process-manager)
        run: cargo msrv --output-format json verify --path process-manager
      - name: Run cargo msrv find on verify failure (process-manager)
        if: ${{ failure() }}
        run: cargo msrv --output-format json find --path process-manager
      - name: Run cargo msrv (process-manager-socket)
        run: cargo msrv --output-format json verify --path process-manager-socket
      - name: Run cargo msrv find on verify failure (process-manager-socket)
        if: ${{ failure() }}
        run: cargo msrv --output-format json find --path process-manager-socket
